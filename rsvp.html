<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP - Jervis & Hazel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav id="navbar" class="scrolled" data-static-scrolled="true">
        <ul class="nav-links">
            <li><a href="index.html#home">Home</a></li>
            <li><a href="index.html#story">Our Story</a></li>
            <li><a href="index.html#details">Details</a></li>
            <li><a href="index.html#location">Location</a></li>
            <li><a href="#rsvp">RSVP</a></li>
        </ul>
        <div class="hamburger">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
    </nav>

    <section id="rsvp" class="section bg-light">
        <div class="container text-center animate-on-scroll" style="padding-top: 80px;">
            <h2 class="section-title">RSVP</h2>
            <div class="gold-divider"></div>
            <p class="section-text mb-4">Please let us know if you'll be able to join us on our special day.</p>

            <form class="rsvp-form animate-on-scroll" style="transition-delay: 0.2s;" id="rsvpForm">
                <input type="hidden" name="access_key" value="fa786807-996b-4f3e-9791-e4c6b809796e">
                <input type="hidden" name="subject" value="New Wedding RSVP Submission">
                <input type="hidden" name="replyto" value="@">

                <input type="text" name="Full Name" placeholder="Full Name(s)" required>
                <input type="email" name="Email" placeholder="Email Address" required>

                <select name="Attending" required>
                    <option value="" disabled selected>Will you be attending?</option>
                    <option value="Yes - Joyfully Accept">Joyfully Accept</option>
                    <option value="No - Regretfully Decline">Regretfully Decline</option>
                </select>

                <select name="Number of Guests" required>
                    <option value="" disabled selected>Number of Guests</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4+">4+</option>
                </select>

                <textarea name="Notes or Dietary Restrictions" placeholder="Any dietary restrictions or special notes?"
                    rows="4"></textarea>

                <button type="submit" class="btn">Send RSVP</button>
                <p id="rsvpMessage" style="display:none; margin-top:15px; font-weight:500;"></p>
            </form>
        </div>
    </section>

    <footer class="footer animate-on-scroll">
        <p>We can't wait to celebrate with you!</p>
        <p class="names-small">Jervis & Hazel</p>
        <p class="date">Saturday, May 9, 2026</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
