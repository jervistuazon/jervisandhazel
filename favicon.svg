<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      .initials { font-family: 'Georgia', serif; font-size: 55px; font-weight: bold; fill: #1f3750; }
      .amp { font-size: 35px; font-style: italic; fill: #1f3750; }
    </style>
  </defs>
  <!-- White Circle Background -->
  <circle cx="50" cy="50" r="48" fill="#ffffff" />
  <!-- Navy Initials -->
  <text x="50" y="70" class="initials" text-anchor="middle">J<tspan class="amp">&amp;</tspan>H</text>
</svg>
