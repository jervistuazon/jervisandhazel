<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.035"/></feComponentTransfer>
    </filter>
    <radialGradient id="washA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1840 80) rotate(125) scale(260 210)">
      <stop stop-color="#E8D9CB" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#E8D9CB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="washB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 980) rotate(26) scale(280 220)">
      <stop stop-color="#E9DACD" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#E9DACD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="washC" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1550 1020) rotate(20) scale(230 180)">
      <stop stop-color="#EBDDD0" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#EBDDD0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="#F8F5F1"/>
  <rect width="1920" height="1080" fill="url(#washA)"/>
  <rect width="1920" height="1080" fill="url(#washB)"/>
  <rect width="1920" height="1080" fill="url(#washC)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.4"/>

  <image href="floral-left.svg" x="-30" y="40" width="260" height="400" opacity="0.38"/>
  <image href="floral-right.svg" x="1670" y="40" width="260" height="400" opacity="0.38"/>
  <image href="floral-left.svg" x="1700" y="700" width="260" height="390" opacity="0.34" transform="scale(-1,1) translate(-3660,0)"/>
  <image href="floral-right.svg" x="-20" y="710" width="260" height="390" opacity="0.34"/>
</svg>
